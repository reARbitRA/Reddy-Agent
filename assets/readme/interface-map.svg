<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" role="img" aria-label="REDDY interface map: three column dashboard with Profile Studio, Tech Stack, Suno and Workspace widgets left, chat terminal and arcade cabinet center, and diagnostics, key deck, task tracker, knowledge vault and guestbook right">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#F4F1EB" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1.6" fill="#06080B" fill-opacity="0.22"/>
    </pattern>
  </defs>

  <rect width="1200" height="720" fill="#06080B"/>
  <rect width="1200" height="720" fill="url(#grid)"/>

  <text x="60" y="52" font-size="12" letter-spacing="3" fill="#F4F1EB" fill-opacity="0.55">REDDY // INTERFACE MAP</text>
  <text x="1140" y="52" font-size="11" letter-spacing="2" fill="#F4F1EB" fill-opacity="0.4" text-anchor="end">src/App.tsx &#183; 12 widget components</text>
  <line x1="60" y1="66" x2="1140" y2="66" stroke="#F4F1EB" stroke-opacity="0.14" stroke-width="1"/>
  <text x="60" y="100" font-size="22" font-weight="700" letter-spacing="3" fill="#F4F1EB">THE COCKPIT &#8212; THREE INSTRUMENT COLUMNS</text>
  <text x="60" y="122" font-size="11" letter-spacing="1.5" fill="#F4F1EB" fill-opacity="0.45">React 19 dashboard &#183; CRT scanlines + engineering grid + brutalist cards on a 12-column layout</text>

  <!-- browser frame -->
  <rect x="60" y="142" width="1080" height="440" fill="#F4F1EB" fill-opacity="0.03" stroke="#F4F1EB" stroke-opacity="0.45" stroke-width="1.5"/>
  <rect x="60" y="142" width="1080" height="30" fill="#F4F1EB" fill-opacity="0.07"/>
  <circle cx="82" cy="157" r="5" fill="#D60019"/>
  <circle cx="100" cy="157" r="5" fill="#A9E838"/>
  <circle cx="118" cy="157" r="5" fill="#22D3EE"/>
  <text x="140" y="161" font-size="10.5" fill="#F4F1EB" fill-opacity="0.6">localhost:3000 &#8212; REDDY Agent</text>

  <!-- LEFT column -->
  <text x="84" y="196" font-size="10.5" letter-spacing="2" fill="#A9E838">LEFT &#183; IDENTITY + WORKSPACE</text>
  <g font-size="10.5">
    <rect x="84" y="206" width="300" height="52" fill="#06080B" stroke="#A9E838" stroke-opacity="0.6"/>
    <text x="98" y="228" fill="#F4F1EB">ProfileStudio</text>
    <text x="98" y="246" font-size="9" fill="#F4F1EB" fill-opacity="0.5">GitHub profile markdown generator</text>

    <rect x="84" y="266" width="300" height="52" fill="#06080B" stroke="#F4F1EB" stroke-opacity="0.3"/>
    <text x="98" y="288" fill="#F4F1EB">TechStackGrid</text>
    <text x="98" y="306" font-size="9" fill="#F4F1EB" fill-opacity="0.5">stack inventory grid</text>

    <rect x="84" y="326" width="300" height="52" fill="#06080B" stroke="#F4F1EB" stroke-opacity="0.3"/>
    <text x="98" y="348" fill="#F4F1EB">SunoWidget</text>
    <text x="98" y="366" font-size="9" fill="#F4F1EB" fill-opacity="0.5">audio playback + playlist import</text>

    <rect x="84" y="386" width="300" height="80" fill="#06080B" stroke="#22D3EE" stroke-opacity="0.7"/>
    <text x="98" y="408" fill="#22D3EE">WorkspaceWidget</text>
    <text x="98" y="426" font-size="9" fill="#F4F1EB" fill-opacity="0.5">Google OAuth &#183; Sheets / Gmail /</text>
    <text x="98" y="440" font-size="9" fill="#F4F1EB" fill-opacity="0.5">Docs tabs + protocol log</text>
  </g>

  <!-- CENTER column -->
  <text x="416" y="196" font-size="10.5" letter-spacing="2" fill="#A9E838">CENTER &#183; AGENT TERMINAL</text>
  <g font-size="10.5">
    <rect x="416" y="206" width="320" height="52" fill="#06080B" stroke="#F4F1EB" stroke-opacity="0.3"/>
    <text x="430" y="228" fill="#F4F1EB">ArcadeCabinetWidget</text>
    <text x="430" y="246" font-size="9" fill="#F4F1EB" fill-opacity="0.5">boot screen + arcade frame</text>

    <rect x="416" y="266" width="320" height="200" fill="#06080B" stroke="#A9E838" stroke-width="1.5"/>
    <rect x="416" y="266" width="320" height="34" fill="#A9E838" fill-opacity="0.1"/>
    <text x="430" y="288" fill="#A9E838" font-weight="700">REDDY // COGNITIVE ASSISTANT</text>
    <text x="628" y="288" font-size="8.5" fill="#F4F1EB" fill-opacity="0.5" text-anchor="end">N SKILLS INITIALIZED</text>
    <rect x="430" y="312" width="292" height="44" fill="#F4F1EB" fill-opacity="0.05"/>
    <text x="442" y="330" font-size="9" fill="#22D3EE">&#187; USER MESSAGE</text>
    <text x="442" y="346" font-size="9" fill="#F4F1EB" fill-opacity="0.55">typed input + voice (Speech API)</text>
    <rect x="430" y="364" width="292" height="56" fill="#F4F1EB" fill-opacity="0.05"/>
    <text x="442" y="382" font-size="9" fill="#A9E838">&#187; AI ASSISTANT</text>
    <text x="442" y="398" font-size="9" fill="#F4F1EB" fill-opacity="0.55">markdown + fenced code blocks</text>
    <text x="442" y="412" font-size="9" fill="#F4F1EB" fill-opacity="0.55">copy / speak / feedback controls</text>
    <rect x="430" y="428" width="292" height="26" fill="#06080B" stroke="#F4F1EB" stroke-opacity="0.25"/>
    <text x="442" y="445" font-size="9" fill="#A9E838">&gt;&gt; _ &#183; quick commands &#183; send</text>
  </g>

  <!-- RIGHT column -->
  <text x="768" y="196" font-size="10.5" letter-spacing="2" fill="#A9E838">RIGHT &#183; INSTRUMENTATION</text>
  <g font-size="10.5">
    <rect x="768" y="206" width="348" height="52" fill="#06080B" stroke="#F4F1EB" stroke-opacity="0.3"/>
    <text x="782" y="228" fill="#F4F1EB">SystemStatusMonitor</text>
    <text x="782" y="246" font-size="9" fill="#F4F1EB" fill-opacity="0.5">simulated gauges + sliders (not live host data)</text>

    <rect x="768" y="266" width="348" height="52" fill="#06080B" stroke="#A9E838" stroke-opacity="0.6"/>
    <text x="782" y="288" fill="#F4F1EB">KeyDeck</text>
    <text x="782" y="306" font-size="9" fill="#F4F1EB" fill-opacity="0.5">Gemini key validate / deploy / source</text>

    <rect x="768" y="326" width="348" height="52" fill="#06080B" stroke="#22D3EE" stroke-opacity="0.7"/>
    <text x="782" y="348" fill="#F4F1EB">TaskTracker</text>
    <text x="782" y="366" font-size="9" fill="#F4F1EB" fill-opacity="0.5">latency area chart &#183; 5s poll &#183; stability</text>

    <rect x="768" y="386" width="348" height="52" fill="#06080B" stroke="#A9E838" stroke-opacity="0.6"/>
    <text x="782" y="408" fill="#F4F1EB">KnowledgeVault</text>
    <text x="782" y="426" font-size="9" fill="#F4F1EB" fill-opacity="0.5">entry list + search + create / delete</text>

    <rect x="768" y="446" width="348" height="52" fill="#06080B" stroke="#F4F1EB" stroke-opacity="0.3"/>
    <text x="782" y="468" fill="#F4F1EB">GuestbookWidget</text>
    <text x="782" y="486" font-size="9" fill="#F4F1EB" fill-opacity="0.5">signatures in browser localStorage</text>
  </g>

  <!-- CRT overlay note -->
  <rect x="60" y="596" width="1080" height="40" fill="#F4F1EB" fill-opacity="0.03" stroke="#F4F1EB" stroke-opacity="0.3"/>
  <text x="76" y="621" font-size="10.5" fill="#F4F1EB" fill-opacity="0.6">CRT layer: scanline overlay + engineering grid + vignette + brutalist 4px borders &#183; boot screen gates first paint &#183; custom target cursor on desktop</text>

  <!-- footer -->
  <line x1="60" y1="656" x2="1140" y2="656" stroke="#F4F1EB" stroke-opacity="0.14" stroke-width="1"/>
  <text x="60" y="676" font-size="10" letter-spacing="2" fill="#F4F1EB" fill-opacity="0.4">REDDY AGENT &#183; ONE SCREEN &#183; EVERY SUBSYSTEM VISIBLE</text>
  <text x="1140" y="676" font-size="10" letter-spacing="2" fill="#F4F1EB" fill-opacity="0.4" text-anchor="end">assets/readme/interface-map.svg</text>

  <rect width="1200" height="720" fill="url(#scan)"/>
</svg>
