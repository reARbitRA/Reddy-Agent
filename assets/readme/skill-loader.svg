<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" role="img" aria-label="REDDY skill loader: skills load at boot from server.ts and at runtime through the inject API, then their guidelines are consumed as active capabilities on every iteration">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#F4F1EB" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1.6" fill="#06080B" fill-opacity="0.22"/>
    </pattern>
    <marker id="sLime" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#A9E838"/>
    </marker>
    <marker id="sCyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22D3EE"/>
    </marker>
  </defs>

  <rect width="1200" height="620" fill="#06080B"/>
  <rect width="1200" height="620" fill="url(#grid)"/>

  <text x="60" y="52" font-size="12" letter-spacing="3" fill="#F4F1EB" fill-opacity="0.55">REDDY // SKILL LOADER</text>
  <text x="1140" y="52" font-size="11" letter-spacing="2" fill="#F4F1EB" fill-opacity="0.4" text-anchor="end">server.ts &#183; core/registry.ts &#183; plugins/</text>
  <line x1="60" y1="66" x2="1140" y2="66" stroke="#F4F1EB" stroke-opacity="0.14" stroke-width="1"/>
  <text x="60" y="100" font-size="22" font-weight="700" letter-spacing="3" fill="#F4F1EB">SKILL LOADING &#8212; BOOT + RUNTIME</text>
  <text x="60" y="122" font-size="11" letter-spacing="1.5" fill="#F4F1EB" fill-opacity="0.45">one registry, two intake paths, consumed on every provider round</text>

  <!-- ============ PANEL 1: boot ============ -->
  <rect x="60" y="152" width="330" height="400" fill="#F4F1EB" fill-opacity="0.03" stroke="#A9E838" stroke-width="1.5"/>
  <rect x="60" y="152" width="330" height="34" fill="#A9E838" fill-opacity="0.12"/>
  <text x="76" y="174" font-size="12" font-weight="700" letter-spacing="2" fill="#A9E838">01 &#183; BOOT SEQUENCE</text>

  <text x="76" y="212" font-size="10.5" fill="#F4F1EB" fill-opacity="0.6">server.ts &#183; startServer()</text>
  <rect x="76" y="224" width="298" height="34" fill="#06080B" stroke="#F4F1EB" stroke-opacity="0.3"/>
  <text x="90" y="246" font-size="10.5" fill="#F4F1EB">const registry = new ToolRegistry()</text>
  <line x1="225" y1="258" x2="225" y2="276" stroke="#A9E838" stroke-width="1.5" marker-end="url(#sLime)"/>
  <rect x="76" y="280" width="298" height="34" fill="#06080B" stroke="#F4F1EB" stroke-opacity="0.3"/>
  <text x="90" y="302" font-size="10.5" fill="#F4F1EB">registry.registerSkill(SystemInfoSkill)</text>
  <line x1="225" y1="314" x2="225" y2="332" stroke="#A9E838" stroke-width="1.5" marker-end="url(#sLime)"/>
  <rect x="76" y="336" width="298" height="34" fill="#A9E838" fill-opacity="0.1" stroke="#A9E838"/>
  <text x="90" y="358" font-size="10.5" fill="#F4F1EB">skills: [System_Info] &#183; tools: 1</text>

  <text x="76" y="404" font-size="10.5" fill="#F4F1EB" fill-opacity="0.6">DEFAULT IDENTITY</text>
  <text x="76" y="424" font-size="10" fill="#F4F1EB" fill-opacity="0.45">AGENTS.md is read from disk at boot</text>
  <text x="76" y="440" font-size="10" fill="#F4F1EB" fill-opacity="0.45">and becomes the default system</text>
  <text x="76" y="456" font-size="10" fill="#F4F1EB" fill-opacity="0.45">instruction for new sessions.</text>
  <text x="76" y="472" font-size="10" fill="#F4F1EB" fill-opacity="0.45">CODER skill: 12 protocols defined</text>
  <text x="76" y="488" font-size="10" fill="#F4F1EB" fill-opacity="0.45">in AGENTS.md steer agent behavior.</text>
  <text x="76" y="524" font-size="10" fill="#F4F1EB" fill-opacity="0.45">Any module can export a Skill and</text>
  <text x="76" y="540" font-size="10" fill="#F4F1EB" fill-opacity="0.45">register it through the same call.</text>

  <line x1="390" y1="352" x2="428" y2="352" stroke="#A9E838" stroke-width="1.5" marker-end="url(#sLime)"/>

  <!-- ============ PANEL 2: runtime ============ -->
  <rect x="432" y="152" width="330" height="400" fill="#F4F1EB" fill-opacity="0.03" stroke="#22D3EE" stroke-width="1.5"/>
  <rect x="432" y="152" width="330" height="34" fill="#22D3EE" fill-opacity="0.12"/>
  <text x="448" y="174" font-size="12" font-weight="700" letter-spacing="2" fill="#22D3EE">02 &#183; RUNTIME INJECTION</text>

  <text x="448" y="212" font-size="10.5" fill="#F4F1EB" fill-opacity="0.6">POST /api/skills/inject</text>
  <rect x="448" y="224" width="298" height="96" fill="#06080B" stroke="#22D3EE" stroke-opacity="0.5"/>
  <text x="462" y="246" font-size="10.5" fill="#22D3EE">{</text>
  <text x="474" y="262" font-size="10.5" fill="#F4F1EB" fill-opacity="0.75">&#8220;name&#8221;: &#8220;Deploy_Notes&#8221;,</text>
  <text x="474" y="278" font-size="10.5" fill="#F4F1EB" fill-opacity="0.75">&#8220;description&#8221;: &#8220;&#8230;&#8221;,</text>
  <text x="474" y="294" font-size="10.5" fill="#F4F1EB" fill-opacity="0.75">&#8220;guidelines&#8221;: &#8220;&#8230;&#8221;</text>
  <text x="462" y="310" font-size="10.5" fill="#22D3EE">}</text>

  <line x1="597" y1="320" x2="597" y2="340" stroke="#22D3EE" stroke-width="1.5" marker-end="url(#sCyan)"/>
  <rect x="448" y="344" width="298" height="34" fill="#06080B" stroke="#F4F1EB" stroke-opacity="0.3"/>
  <text x="462" y="366" font-size="10.5" fill="#F4F1EB">registerSkill({ &#8230;, tools: [] })</text>
  <line x1="597" y1="378" x2="597" y2="396" stroke="#22D3EE" stroke-width="1.5" marker-end="url(#sCyan)"/>
  <rect x="448" y="400" width="298" height="34" fill="#22D3EE" fill-opacity="0.1" stroke="#22D3EE"/>
  <text x="462" y="422" font-size="10.5" fill="#F4F1EB">200 { &#8220;status&#8221;: &#8220;injected&#8221; }</text>

  <text x="448" y="462" font-size="10" fill="#F4F1EB" fill-opacity="0.45">Text skills carry guidance only &#8212;</text>
  <text x="448" y="478" font-size="10" fill="#F4F1EB" fill-opacity="0.45">no tool schema, no execution slot.</text>
  <text x="448" y="494" font-size="10" fill="#F4F1EB" fill-opacity="0.45">They reshape how REDDY answers</text>
  <text x="448" y="510" font-size="10" fill="#F4F1EB" fill-opacity="0.45">without extending what it can run.</text>
  <text x="448" y="532" font-size="10" fill="#F4F1EB" fill-opacity="0.45">Injection is per-process: it persists</text>
  <text x="448" y="548" font-size="10" fill="#F4F1EB" fill-opacity="0.45">until the server restarts.</text>

  <line x1="762" y1="352" x2="800" y2="352" stroke="#A9E838" stroke-width="1.5" marker-end="url(#sLime)"/>

  <!-- ============ PANEL 3: consumption ============ -->
  <rect x="804" y="152" width="336" height="400" fill="#F4F1EB" fill-opacity="0.03" stroke="#F4F1EB" stroke-opacity="0.45" stroke-width="1.5"/>
  <rect x="804" y="152" width="336" height="34" fill="#F4F1EB" fill-opacity="0.08"/>
  <text x="820" y="174" font-size="12" font-weight="700" letter-spacing="2" fill="#F4F1EB">03 &#183; CONSUMPTION</text>

  <text x="820" y="212" font-size="10.5" fill="#F4F1EB" fill-opacity="0.6">EVERY PROVIDER ROUND</text>
  <rect x="820" y="224" width="304" height="76" fill="#06080B" stroke="#A9E838" stroke-opacity="0.6"/>
  <text x="834" y="246" font-size="10.5" fill="#A9E838">ACTIVE_CAPABILITIES:</text>
  <text x="834" y="264" font-size="10.5" fill="#F4F1EB" fill-opacity="0.75">[SKILL: System_Info]</text>
  <text x="834" y="280" font-size="10.5" fill="#F4F1EB" fill-opacity="0.75">[SKILL: Deploy_Notes]</text>
  <text x="834" y="296" font-size="10" fill="#F4F1EB" fill-opacity="0.45">appended as a system message</text>

  <text x="820" y="330" font-size="10.5" fill="#F4F1EB" fill-opacity="0.6">DASHBOARD VISIBILITY</text>
  <rect x="820" y="342" width="304" height="62" fill="#06080B" stroke="#22D3EE" stroke-opacity="0.5"/>
  <text x="834" y="364" font-size="10.5" fill="#22D3EE">GET /api/skills</text>
  <text x="834" y="382" font-size="10" fill="#F4F1EB" fill-opacity="0.55">{ &#8220;skills&#8221;: [&#8230;] } &#8594; header shows</text>
  <text x="834" y="396" font-size="10" fill="#F4F1EB" fill-opacity="0.55">&#8220;N SKILLS INITIALIZED&#8221;</text>

  <text x="820" y="430" font-size="10.5" fill="#F4F1EB" fill-opacity="0.6">AGENT LOOP EFFECT</text>
  <text x="820" y="452" font-size="10" fill="#F4F1EB" fill-opacity="0.45">&#9632; tools &#8594; Gemini functionDeclarations</text>
  <text x="820" y="472" font-size="10" fill="#F4F1EB" fill-opacity="0.45">&#9632; guidelines &#8594; behavioral context</text>
  <text x="820" y="492" font-size="10" fill="#F4F1EB" fill-opacity="0.45">&#9632; re-register &#8594; same-name replacement</text>
  <text x="820" y="512" font-size="10" fill="#F4F1EB" fill-opacity="0.45">&#9632; no restart required to add guidance</text>

  <circle cx="1120" cy="530" r="5" fill="#A9E838">
    <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- footer -->
  <line x1="60" y1="580" x2="1140" y2="580" stroke="#F4F1EB" stroke-opacity="0.14" stroke-width="1"/>
  <text x="60" y="600" font-size="10" letter-spacing="2" fill="#F4F1EB" fill-opacity="0.4">REDDY AGENT &#183; BOOT REGISTRATION + RUNTIME INJECTION + ACTIVE_CAPABILITIES</text>
  <text x="1140" y="600" font-size="10" letter-spacing="2" fill="#F4F1EB" fill-opacity="0.4" text-anchor="end">assets/readme/skill-loader.svg</text>

  <rect width="1200" height="620" fill="url(#scan)"/>
</svg>
