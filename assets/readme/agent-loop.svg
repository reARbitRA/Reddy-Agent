<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" role="img" aria-label="REDDY agent loop: user message enters session memory, then a maximum five iteration loop assembles context, calls the provider, executes tools, observes results, and returns the final response">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#F4F1EB" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1.6" fill="#06080B" fill-opacity="0.22"/>
    </pattern>
    <marker id="arrowLime" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#A9E838"/>
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22D3EE"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#D60019"/>
    </marker>
    <marker id="arrowInk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#F4F1EB" fill-opacity="0.6"/>
    </marker>
  </defs>

  <rect width="1200" height="740" fill="#06080B"/>
  <rect width="1200" height="740" fill="url(#grid)"/>

  <!-- header -->
  <text x="60" y="52" font-size="12" letter-spacing="3" fill="#F4F1EB" fill-opacity="0.55">REDDY // AGENT LOOP</text>
  <text x="1140" y="52" font-size="11" letter-spacing="2" fill="#F4F1EB" fill-opacity="0.4" text-anchor="end">core/engine.ts &#183; RedAeyeEngine</text>
  <line x1="60" y1="66" x2="1140" y2="66" stroke="#F4F1EB" stroke-opacity="0.14" stroke-width="1"/>
  <text x="60" y="100" font-size="22" font-weight="700" letter-spacing="3" fill="#F4F1EB">THINK &#8594; SELECT TOOL &#8594; EXECUTE &#8594; OBSERVE &#8594; RESPOND</text>

  <!-- input -->
  <rect x="60" y="128" width="480" height="52" fill="#F4F1EB" fill-opacity="0.05" stroke="#22D3EE" stroke-width="1.5"/>
  <text x="76" y="150" font-size="13" font-weight="700" letter-spacing="1.5" fill="#22D3EE">USER MESSAGE</text>
  <text x="76" y="168" font-size="10.5" fill="#F4F1EB" fill-opacity="0.55">POST /api/chat { message, session_id }</text>
  <rect x="580" y="128" width="240" height="52" fill="#F4F1EB" fill-opacity="0.03" stroke="#F4F1EB" stroke-opacity="0.25" stroke-width="1"/>
  <text x="596" y="150" font-size="10.5" letter-spacing="1" fill="#F4F1EB" fill-opacity="0.6">KNOWLEDGE CONTEXT</text>
  <text x="596" y="168" font-size="10.5" fill="#F4F1EB" fill-opacity="0.45">vault entries appended</text>
  <line x1="540" y1="154" x2="580" y2="154" stroke="#22D3EE" stroke-width="1.5" marker-end="url(#arrowCyan)"/>

  <!-- memory write -->
  <line x1="300" y1="180" x2="300" y2="206" stroke="#22D3EE" stroke-width="1.5" marker-end="url(#arrowCyan)"/>
  <rect x="60" y="208" width="480" height="52" fill="#F4F1EB" fill-opacity="0.05" stroke="#22D3EE" stroke-width="1.5"/>
  <text x="76" y="230" font-size="13" font-weight="700" letter-spacing="1.5" fill="#22D3EE">SESSION MEMORY WRITE</text>
  <text x="76" y="248" font-size="10.5" fill="#F4F1EB" fill-opacity="0.55">MemoryVault.add(&#8220;user&#8221;, input) &#183; core/memory.ts</text>

  <!-- loop panel -->
  <rect x="40" y="290" width="1120" height="330" fill="#A9E838" fill-opacity="0.02" stroke="#A9E838" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="56" y="314" font-size="11" letter-spacing="2.5" fill="#A9E838">AGENT LOOP &#8212; maxIterations = 5</text>
  <text x="1100" y="314" font-size="10" letter-spacing="1.5" fill="#F4F1EB" fill-opacity="0.4" text-anchor="end">iteration guard: i &lt; 5</text>

  <line x1="300" y1="260" x2="300" y2="286" stroke="#22D3EE" stroke-width="1.5" marker-end="url(#arrowCyan)"/>

  <!-- step 1 -->
  <rect x="80" y="336" width="320" height="76" fill="#06080B" stroke="#A9E838" stroke-width="1.5"/>
  <text x="96" y="360" font-size="13" font-weight="700" letter-spacing="1.5" fill="#A9E838">1 &#183; ASSEMBLE CONTEXT</text>
  <text x="96" y="378" font-size="10.5" fill="#F4F1EB" fill-opacity="0.6">memory.getContext() + system prompt</text>
  <text x="96" y="394" font-size="10.5" fill="#F4F1EB" fill-opacity="0.6">+ ACTIVE_CAPABILITIES guidelines</text>

  <line x1="400" y1="374" x2="452" y2="374" stroke="#A9E838" stroke-width="1.5" marker-end="url(#arrowLime)"/>

  <!-- step 2 -->
  <rect x="456" y="336" width="320" height="76" fill="#06080B" stroke="#A9E838" stroke-width="1.5"/>
  <text x="472" y="360" font-size="13" font-weight="700" letter-spacing="1.5" fill="#A9E838">2 &#183; PROVIDER REQUEST</text>
  <text x="472" y="378" font-size="10.5" fill="#F4F1EB" fill-opacity="0.6">orchestrator.request(history, tools)</text>
  <text x="472" y="394" font-size="10.5" fill="#F4F1EB" fill-opacity="0.6">gemini-1.5-flash &#183; functionDeclarations</text>

  <line x1="776" y1="374" x2="828" y2="374" stroke="#A9E838" stroke-width="1.5" marker-end="url(#arrowLime)"/>

  <!-- decision -->
  <path d="M 960 330 L 1040 374 L 960 418 L 880 374 Z" fill="#06080B" stroke="#F4F1EB" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="960" y="370" font-size="11" font-weight="700" fill="#F4F1EB" text-anchor="middle">function</text>
  <text x="960" y="386" font-size="11" font-weight="700" fill="#F4F1EB" text-anchor="middle">calls?</text>

  <!-- YES path down to tools -->
  <line x1="960" y1="418" x2="960" y2="470" stroke="#22D3EE" stroke-width="1.5" marker-end="url(#arrowCyan)"/>
  <text x="972" y="446" font-size="11" font-weight="700" fill="#22D3EE">YES &#183; tool_calls[]</text>

  <!-- step 3 execute -->
  <rect x="456" y="474" width="504" height="76" fill="#06080B" stroke="#22D3EE" stroke-width="1.5"/>
  <text x="472" y="498" font-size="13" font-weight="700" letter-spacing="1.5" fill="#22D3EE">3 &#183; EXECUTE TOOLS</text>
  <text x="472" y="516" font-size="10.5" fill="#F4F1EB" fill-opacity="0.6">registry.executeTool(name, args) &#8212; Promise.all for parallel calls</text>
  <text x="472" y="532" font-size="10.5" fill="#F4F1EB" fill-opacity="0.6">errors normalize to PROTOCOL_ERROR / EXECUTION_ERROR strings</text>

  <line x1="456" y1="512" x2="404" y2="512" stroke="#22D3EE" stroke-width="1.5" marker-end="url(#arrowCyan)"/>

  <!-- step 4 observe -->
  <rect x="80" y="474" width="320" height="76" fill="#06080B" stroke="#22D3EE" stroke-width="1.5"/>
  <text x="96" y="498" font-size="13" font-weight="700" letter-spacing="1.5" fill="#22D3EE">4 &#183; OBSERVE</text>
  <text x="96" y="516" font-size="10.5" fill="#F4F1EB" fill-opacity="0.6">memory.addToolResult(id, name,</text>
  <text x="96" y="532" font-size="10.5" fill="#F4F1EB" fill-opacity="0.6">JSON.stringify(result)) &#8594; loop</text>

  <!-- loop-back arrow up the left edge -->
  <path d="M 80 512 L 56 512 L 56 374 L 74 374" fill="none" stroke="#A9E838" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrowLime)"/>
  <text x="44" y="446" font-size="9.5" letter-spacing="1" fill="#A9E838" transform="rotate(-90 44 446)">NEXT ITERATION</text>

  <!-- NO path to response -->
  <path d="M 1040 374 L 1104 374 L 1104 640" fill="none" stroke="#A9E838" stroke-width="1.5" marker-end="url(#arrowLime)"/>
  <text x="1112" y="510" font-size="11" font-weight="700" fill="#A9E838" transform="rotate(-90 1112 510)">NO &#183; final content</text>

  <!-- final response -->
  <rect x="80" y="644" width="480" height="56" fill="#A9E838" fill-opacity="0.08" stroke="#A9E838" stroke-width="2"/>
  <text x="96" y="668" font-size="13" font-weight="700" letter-spacing="1.5" fill="#A9E838">5 &#183; RESPOND &#8212; FINAL RESPONSE</text>
  <text x="96" y="686" font-size="10.5" fill="#F4F1EB" fill-opacity="0.6">memory.add(&#8220;assistant&#8221;, content) &#183; returned to chat console</text>

  <!-- safety exit -->
  <rect x="600" y="644" width="504" height="56" fill="#D60019" fill-opacity="0.06" stroke="#D60019" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="616" y="668" font-size="13" font-weight="700" letter-spacing="1.5" fill="#D60019">SAFETY EXIT &#8212; 5 ITERATIONS REACHED</text>
  <text x="616" y="686" font-size="10.5" fill="#F4F1EB" fill-opacity="0.6">&#8220;MAX_ITERATIONS_REACHED: Autonomous loop terminated safely.&#8221;</text>

  <!-- footer -->
  <line x1="60" y1="716" x2="1140" y2="716" stroke="#F4F1EB" stroke-opacity="0.14" stroke-width="1"/>
  <text x="60" y="732" font-size="10" letter-spacing="2" fill="#F4F1EB" fill-opacity="0.4">REDDY AGENT &#183; ITERATIVE TOOL-CALLING LOOP</text>
  <text x="1140" y="732" font-size="10" letter-spacing="2" fill="#F4F1EB" fill-opacity="0.4" text-anchor="end">assets/readme/agent-loop.svg</text>

  <rect width="1200" height="740" fill="url(#scan)"/>
</svg>
