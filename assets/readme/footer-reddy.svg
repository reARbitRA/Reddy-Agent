<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" role="img" aria-label="REDDY Agent footer with instrument glyph, palette strip and repository signature">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#F4F1EB" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1.6" fill="#06080B" fill-opacity="0.22"/>
    </pattern>
    <radialGradient id="fsweep" gradientUnits="userSpaceOnUse" cx="240" cy="150" r="80">
      <stop offset="0%" stop-color="#A9E838" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#A9E838" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="320" fill="#06080B"/>
  <rect width="1200" height="320" fill="url(#grid)"/>

  <!-- left instrument -->
  <g>
    <circle cx="240" cy="150" r="82" fill="none" stroke="#F4F1EB" stroke-opacity="0.2" stroke-width="1.5"/>
    <circle cx="240" cy="150" r="58" fill="none" stroke="#F4F1EB" stroke-opacity="0.12" stroke-width="1"/>
    <circle cx="240" cy="150" r="34" fill="none" stroke="#F4F1EB" stroke-opacity="0.12" stroke-width="1"/>
    <line x1="240" y1="68" x2="240" y2="232" stroke="#F4F1EB" stroke-opacity="0.1"/>
    <line x1="158" y1="150" x2="322" y2="150" stroke="#F4F1EB" stroke-opacity="0.1"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 240 150" to="360 240 150" dur="10s" repeatCount="indefinite"/>
      <path d="M 240 150 L 240 70 A 80 80 0 0 1 316.9 126 Z" fill="url(#fsweep)"/>
      <line x1="240" y1="150" x2="240" y2="70" stroke="#A9E838" stroke-width="2"/>
    </g>
    <circle cx="240" cy="150" r="7" fill="#A9E838"/>
    <circle cx="240" cy="92" r="4" fill="#22D3EE"/>
    <circle cx="298" cy="184" r="4" fill="#D60019"/>
    <circle cx="182" cy="184" r="4" fill="#F4F1EB"/>
  </g>

  <!-- wordmark -->
  <text x="400" y="132" font-size="56" font-weight="700" letter-spacing="8" fill="#F4F1EB">REDDY</text>
  <rect x="402" y="146" width="220" height="3" fill="#A9E838"/>
  <text x="402" y="176" font-size="13" letter-spacing="4" fill="#A9E838">OPERATIONAL AI COCKPIT</text>
  <text x="402" y="202" font-size="11" letter-spacing="2" fill="#F4F1EB" fill-opacity="0.5">MEMORY &#183; TOOLS &#183; SKILLS &#183; KNOWLEDGE &#183; DIAGNOSTICS &#183; WORKSPACE</text>
  <text x="402" y="228" font-size="11" letter-spacing="2" fill="#F4F1EB" fill-opacity="0.5">github.com/reARbitRA/Reddy-Agent</text>

  <!-- palette strip -->
  <g>
    <rect x="820" y="96" width="60" height="60" fill="#06080B" stroke="#A9E838" stroke-width="1.5"/>
    <text x="850" y="176" font-size="9" fill="#A9E838" text-anchor="middle">#A9E838</text>
    <text x="850" y="190" font-size="8" fill="#F4F1EB" fill-opacity="0.4" text-anchor="middle">AGENT LIME</text>

    <rect x="890" y="96" width="60" height="60" fill="#06080B" stroke="#22D3EE" stroke-width="1.5"/>
    <text x="920" y="176" font-size="9" fill="#22D3EE" text-anchor="middle">#22D3EE</text>
    <text x="920" y="190" font-size="8" fill="#F4F1EB" fill-opacity="0.4" text-anchor="middle">INSTRUMENT CYAN</text>

    <rect x="960" y="96" width="60" height="60" fill="#06080B" stroke="#D60019" stroke-width="1.5"/>
    <text x="990" y="176" font-size="9" fill="#D60019" text-anchor="middle">#D60019</text>
    <text x="990" y="190" font-size="8" fill="#F4F1EB" fill-opacity="0.4" text-anchor="middle">SIGNAL RED</text>

    <rect x="1030" y="96" width="60" height="60" fill="#06080B" stroke="#F4F1EB" stroke-width="1.5"/>
    <text x="1060" y="176" font-size="9" fill="#F4F1EB" text-anchor="middle">#F4F1EB</text>
    <text x="1060" y="190" font-size="8" fill="#F4F1EB" fill-opacity="0.4" text-anchor="middle">CONSOLE INK</text>

    <rect x="1100" y="96" width="60" height="60" fill="#06080B" stroke="#F4F1EB" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="1130" y="176" font-size="9" fill="#F4F1EB" fill-opacity="0.8" text-anchor="middle">#06080B</text>
    <text x="1130" y="190" font-size="8" fill="#F4F1EB" fill-opacity="0.4" text-anchor="middle">CRT BLACK</text>
  </g>

  <line x1="60" y1="232" x2="1140" y2="232" stroke="#F4F1EB" stroke-opacity="0.14" stroke-width="1"/>
  <text x="60" y="260" font-size="10" letter-spacing="2" fill="#F4F1EB" fill-opacity="0.45">REDDY IS A COCKPIT, NOT AN ORACLE &#8212; every dial above maps to code you can read.</text>
  <circle cx="1140" cy="256" r="4" fill="#A9E838">
    <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
  </circle>

  <rect width="1200" height="320" fill="url(#scan)"/>
</svg>
